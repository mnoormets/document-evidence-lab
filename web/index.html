<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Document Evidence Lab</title><style>body{font:16px Segoe UI,sans-serif;background:#f3f5ef;color:#18302d;max-width:1000px;margin:auto;padding:32px}h1{font-size:40px}input,select,button{font:inherit;padding:12px;border:1px solid #bbb;border-radius:8px}input{width:50%}button{background:#203d35;color:white;cursor:pointer}article,section{background:white;border-radius:12px;padding:22px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#53655a}#error{color:#9a3020}@media(max-width:600px){input{width:90%}}</style><h1>Dokumendid. Tõendid. Mõõtmine.</h1><p>Võrdle BM25 otsingut ja BM25 + tähekolmikute otsingut väljamõeldud dokumentidel.</p><form id="search"><input id="q" aria-label="Otsing" value="Smartposti tarne" maxlength="300" required><select id="mode" aria-label="Otsingu meetod"><option value="hybrid">Hübriid</option><option value="bm25">BM25</option></select><button>Otsi</button></form><p id="error" role="alert"></p><div id="results"></div><section id="document" hidden></section><section><h2>Katsetulemused</h2><p>See väike sünteetiline test ei näita päris lepingute täpsust.</p><pre id="metrics">Laadin…</pre></section><script>
const $=id=>document.getElementById(id);async function get(url){let r=await fetch(url);if(!r.ok)throw Error('Päring ebaõnnestus: '+r.status);return r.json()}
function text(tag,value){let el=document.createElement(tag);el.textContent=value;return el}
async function openDoc(id){try{let d=await get('/api/documents/'+encodeURIComponent(id));let box=$('document');box.hidden=false;box.replaceChildren(text('h2',d.id),text('pre',d.text),text('h3','Eraldatud väljad ja allikakohad'),text('pre',JSON.stringify({fields:d.fields,evidence:d.evidence,warnings:d.warnings},null,2)))}catch(e){$('error').textContent=e.message}}
let searchVersion=0;async function search(e){if(e)e.preventDefault();let version=++searchVersion;try{let d=await get('/api/search?q='+encodeURIComponent($('q').value)+'&mode='+$('mode').value);if(version!==searchVersion)return;$('error').textContent='';$('results').replaceChildren();$('document').hidden=true;for(let r of d.results){let box=document.createElement('article');box.append(text('h2',r.document_id),text('small',r.passage_id+' · skoor '+r.score),text('pre',r.text));let button=text('button','Ava dokument ja väljad');button.onclick=()=>openDoc(r.document_id);box.append(button);$('results').append(box)}if(!d.results.length)$('results').append(text('p','Leide pole.'))}catch(e){if(version===searchVersion)$('error').textContent=e.message}}
$('search').onsubmit=search;search();get('/api/evaluation').then(d=>$('metrics').textContent=JSON.stringify({retrieval:Object.fromEntries(Object.entries(d.retrieval).map(([k,v])=>[k,{hit_rate_at_3:v.hit_rate_at_3,mrr_at_3:v.mrr_at_3,mean_search_ms:v.mean_search_ms}])),extraction:d.extraction},null,2)).catch(e=>$('metrics').textContent=e.message);
</script></html>
